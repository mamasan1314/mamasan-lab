<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>21 顆蠟燭・內部工程預覽</title><style>body{margin:0;background:#f4f1f6;color:#231b30;font:16px/1.7 system-ui,sans-serif}main{max-width:1040px;margin:24px auto;padding:16px}a{color:#69427e}button,.button{padding:10px 18px;display:inline-block;background:#614171;color:white;border:0;border-radius:6px;text-decoration:none}input,textarea,select{box-sizing:border-box}table{width:100%}td{vertical-align:top}small{display:block}button:disabled{opacity:.5}</style><style>.hlc21-picker{border:1px solid #d6d0df;padding:1.25rem;border-radius:12px;clear:both;min-width:0;margin:1rem 0;color:#231b30;background:#fbfafc}
.hlc21-picker legend{font-size:1.25rem;font-weight:700}.hlc21-row{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.7rem 0;border-bottom:1px solid #e5e0e9}.hlc21-row small{display:block;color:#564d61;font-size:.875rem}.hlc21-row input{font-size:16px!important;width:5rem!important;min-height:44px;text-align:center;flex-shrink:0}.hlc21-total{font-weight:700}.hlc21-picker~button:disabled{opacity:.55;cursor:not-allowed}
.hlc21-admin{max-width:1040px}.hlc21-products{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:1rem}.hlc21-admin section,.hlc21-admin details{background:white;border:1px solid #d6d0df;padding:1.2rem;margin:1rem 0;border-radius:8px}.hlc21-admin h2{margin-top:0}.hlc21-setting{display:block;margin:.75rem 0}.hlc21-setting input,.hlc21-admin textarea,.hlc21-admin select{display:block;width:100%;max-width:100%;margin-top:.35rem;font-size:16px;min-height:40px}.hlc21-checkbox{display:block;margin:1rem 0}.hlc21-admin summary{cursor:pointer;font-size:1rem;font-weight:600}.hlc21-form-error{color:#b32d2e}.hlc21-names{padding-left:1.2rem}.hlc21-names li{margin-bottom:.65rem}.hlc21-names span{display:block}.hlc21-admin th{text-align:left}
</style><body><aside style="padding:12px;background:#fff3cd;color:#392d0d;font:16px/1.6 sans-serif;text-align:center">mamasan 內部工程預覽・全部為假商品與測試數量，尚未上線／未經 Tiffany 核准。<br><a href="index.html">預覽目錄</a> · <a href="admin.html">後台設定</a> · <a href="product.html">商品選款</a> · <a href="landing.html">動態 LP</a> · <a href="order.html">訂單／CRM 快照</a></aside><main style="max-width:660px"><h1>希望之光・21 顆限定組</h1><p>NT$2,980</p><ul><li>希望之光∞頻率蠟燭 21 顆</li><li>玻璃燭台 1 個／組</li></ul><p>靈魂藍圖諮詢｜10 分鐘，每筆訂單 1 次，購買後 30 天內使用。</p><form><fieldset class="hlc21-picker"><legend>選你的 21 顆（每組）</legend><p>十款任選，同款可重複。未選的款式填 0。</p><input type="hidden" name="hopelight_c21_nonce" value="synthetic-nonce"><input type="hidden" name="hopelight_c21_source" value="unknown"><label class="hlc21-row"><span><strong>安然入夜</strong><small>回到溫柔、安靜與放鬆的節奏</small></span><input aria-label="安然入夜顆數" type="number" min="0" max="21" step="1" inputmode="numeric" required name="hopelight_c21_mix[peaceful-night]" value="0"></label><label class="hlc21-row"><span><strong>好運爆棚</strong><small>開啟美好、迎接好事發生</small></span><input aria-label="好運爆棚顆數" type="number" min="0" max="21" step="1" inputmode="numeric" required name="hopelight_c21_mix[good-luck]" value="0"></label><label class="hlc21-row"><span><strong>小人退散</strong><small>界線、降低干擾與內在穩定</small></span><input aria-label="小人退散顆數" type="number" min="0" max="21" step="1" inputmode="numeric" required name="hopelight_c21_mix[boundaries]" value="0"></label><label class="hlc21-row"><span><strong>財富豐盛</strong><small>顯化意圖、豐盛意識與行動提醒</small></span><input aria-label="財富豐盛顆數" type="number" min="0" max="21" step="1" inputmode="numeric" required name="hopelight_c21_mix[abundance]" value="0"></label><label class="hlc21-row"><span><strong>吸引顧客</strong><small>服務曝光、客源連結與經營意圖</small></span><input aria-label="吸引顧客顆數" type="number" min="0" max="21" step="1" inputmode="numeric" required name="hopelight_c21_mix[customers]" value="0"></label><label class="hlc21-row"><span><strong>吸引桃花</strong><small>良緣、人際與關係開放度</small></span><input aria-label="吸引桃花顆數" type="number" min="0" max="21" step="1" inputmode="numeric" required name="hopelight_c21_mix[romance]" value="0"></label><label class="hlc21-row"><span><strong>學/事業進步</strong><small>學習節奏、工作聚焦與事業行動提醒</small></span><input aria-label="學/事業進步顆數" type="number" min="0" max="21" step="1" inputmode="numeric" required name="hopelight_c21_mix[study-career-growth]" value="0"></label><label class="hlc21-row"><span><strong>貴人常臨</strong><small>貴人相助、良緣與合作機會</small></span><input aria-label="貴人常臨顆數" type="number" min="0" max="21" step="1" inputmode="numeric" required name="hopelight_c21_mix[benefactors]" value="0"></label><label class="hlc21-row"><span><strong>感情升溫</strong><small>關係溫度、理解與互動回暖</small></span><input aria-label="感情升溫顆數" type="number" min="0" max="21" step="1" inputmode="numeric" required name="hopelight_c21_mix[relationship-warmth]" value="0"></label><label class="hlc21-row"><span><strong>淨化除穢</strong><small>整理場域、清理雜訊與穩定空間</small></span><input aria-label="淨化除穢顆數" type="number" min="0" max="21" step="1" inputmode="numeric" required name="hopelight_c21_mix[cleansing]" value="0"></label><p class="hlc21-total" role="status" aria-live="polite">請選滿 21 顆。</p><noscript>填完十款後送出，系統會檢查總數。</noscript></fieldset><button class="single_add_to_cart_button">加入購物車</button><p id="result" role="status"></p></form></main><script>(() => {
  document.querySelectorAll('.hlc21-picker').forEach(picker => {
    const fields = [...picker.querySelectorAll('input[type="number"]')];
    const form = picker.closest('form');
    const button = form?.querySelector('.single_add_to_cart_button');
    const status = picker.querySelector('[role="status"]');
    const update = () => {
      const valid = fields.every(input => /^(0|[1-9][0-9]*)$/.test(input.value) && Number(input.value) <= 21);
      const total = fields.reduce((sum, input) => sum + (Number(input.value) || 0), 0);
      const ok = valid && total === 21;
      status.textContent = !valid ? '請填 0 到 21 的整數。' : total < 21 ? `已選 ${total} 顆，還差 ${21 - total} 顆。` : total > 21 ? `已選 ${total} 顆，超過 ${total - 21} 顆。` : '已選滿 21 顆，可以加入購物車。';
      if (button) { button.disabled = !ok; button.setAttribute('aria-disabled', String(!ok)); }
      return ok;
    };
    picker.addEventListener('input', update);
    form?.addEventListener('submit', event => { if (!update()) { event.preventDefault(); fields.find(input => !input.validity.valid)?.focus(); } });
    update();
  });
})();
</script><script>document.querySelector("form").addEventListener("submit",e=>{e.preventDefault();if(!e.defaultPrevented)return;document.querySelector("#result").textContent="本機假資料預覽：已選滿，正式交易尚未啟用。"})</script></body></html>
