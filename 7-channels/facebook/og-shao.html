<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<!-- 官網 /shao/ 的分享預覽圖，1200×630。輸出到 mamasan.three-quarters.net/assets/img/og-shao.jpg（見 README） -->
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    display: grid; grid-template-columns: 360px 1fr; gap: 64px; align-items: center; padding: 0 90px; box-sizing: border-box;
    font-family: Georgia, "Noto Serif TC", "Songti TC", "PMingLiU", serif; color: #f7ecdc;
    background:
      radial-gradient(circle at 25% 50%, rgba(217, 164, 75, 0.28), transparent 30%),
      radial-gradient(2px 2px at 70% 16%, rgba(247, 236, 220, 0.8), transparent 60%),
      radial-gradient(2px 2px at 90% 80%, rgba(217, 164, 75, 0.9), transparent 60%),
      radial-gradient(1.5px 1.5px at 55% 88%, rgba(217, 164, 75, 0.8), transparent 60%),
      linear-gradient(160deg, #3d0e19 0%, #2a0911 55%, #1c060c 100%);
  }
  img { width: 360px; filter: drop-shadow(0 0 40px rgba(217, 164, 75, 0.35)); }
  .eyebrow { font-size: 24px; letter-spacing: 0.3em; color: #d9a44b; margin: 0 0 22px; }
  h1 { font-size: 50px; line-height: 1.5; letter-spacing: 0.03em; margin: 0 0 28px; white-space: nowrap; }
  .url { font-size: 22px; color: rgba(247, 236, 220, 0.7); margin: 0; letter-spacing: 0.04em; }
</style>
</head>
<body>
  <img src="../../../mamasan.three-quarters.net/assets/img/shao/logo.webp" alt="">
  <div>
    <p class="eyebrow">宇宙媽媽燒｜身心靈選品</p>
    <h1>燒蠟燭、燒好物，<br>燒掉你不需要的舊能量。</h1>
    <p class="url">mamasan.three-quarters.net/shao</p>
  </div>
</body>
</html>
