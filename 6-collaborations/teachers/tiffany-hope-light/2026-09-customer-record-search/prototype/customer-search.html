<title>希望之光個案檢索</title>
<!-- 本檔由 darrenfiy-studio PRODUCTS/hopelight-case-record-system/scripts/build-demo.js 產生，畫面和正式版是同一份程式。
     不要直接改這個檔：改正式版的 src/renderer/ 再重新產生。資料全是虛構示範資料。 -->
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 希望之光個案檢索：畫面樣式。正式版與示範稿（v0.9 起）共用這一份，scripts/build-demo.js 會把它包進示範稿。
   版面：上方細品牌列；首頁是一欄置中的「搜尋卡（四列）→ 搜尋結果 → 今日壽星」；
   個案頁是紀錄表：上半「基本資料｜大方向」約占半個畫面，下半每次來訪一列，當次備註對齊大方向那一欄。
   字級：尺寸一律用 rem，小／中／大只改根字級，整個畫面等比例放大，標籤與內文的比例不變。 */
:root{
  /* 取自 hopebox.com.tw 官網（2026-09-26 讀取）：蜜桃底 #F8ECE6、奶油卡 #FFF8F4、深紅棕字 #4B1D0D、
     銅棕按鈕 #A7624D、玫瑰細框 #D8AFA0、頁尾字 #72574E／#5A210F。其餘深淺為依此推出的中間色 */
  --paper:#F8ECE6; --card:#FFF8F4; --inset:#F7EAE3;
  --ink:#4B1D0D; --ink-2:#5E3A2E; --muted:#72574E;
  --line:#EBD8CF; --line-2:#D8AFA0;
  --accent:#A7624D; --accent-ink:#5A210F; --accent-soft:#F0D5C8; --accent-wash:#F8E4DA;
  --on-accent:#FFFFFF;
  /* 初評／複評／課程用來區分類型，不跟品牌色走 */
  --teal:#1F6E68; --teal-soft:#DDEBE8;
  --blue:#3F4A8C; --blue-soft:#E2E5F2;
  --plum:#8A3F86; --plum-soft:#F2E3F0;
  --danger:#A63636;
  --scrim:rgba(43,20,12,.5);
  --shadow:0 1px 2px rgba(75,29,13,.06), 0 8px 24px -18px rgba(75,29,13,.32);
  --r:10px;
  /* 正式版離線使用，字型檔隨程式安裝（vendor/）；示範稿從 Google Fonts 載入同一組字型 */
  --sans:"Noto Sans TC Variable","Noto Sans TC","Microsoft JhengHei UI","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;
  --serif:"Noto Serif TC Variable","Noto Serif TC","Songti TC",serif;
  --mono:"IBM Plex Mono","Noto Sans TC Variable","Noto Sans TC",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1C1310; --card:#261A16; --inset:#2F211C;
    --ink:#F7EAE4; --ink-2:#E6D0C6; --muted:#C7ABA0;
    --line:#3F2D27; --line-2:#56403A;
    --accent:#E3A78F; --accent-ink:#F4D2C4; --accent-soft:#5B3527; --accent-wash:#35221B;
    --on-accent:#2A140C;
    --teal:#5DC1B2; --teal-soft:#10312E;
    --blue:#9AA8E4; --blue-soft:#1B2044;
    --plum:#D48FCE; --plum-soft:#32162F;
    --danger:#E4867F;
    --scrim:rgba(0,0,0,.6);
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 28px -18px rgba(0,0,0,.9);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#1C1310; --card:#261A16; --inset:#2F211C;
  --ink:#F7EAE4; --ink-2:#E6D0C6; --muted:#C7ABA0;
  --line:#3F2D27; --line-2:#56403A;
  --accent:#E3A78F; --accent-ink:#F4D2C4; --accent-soft:#5B3527; --accent-wash:#35221B;
  --on-accent:#2A140C;
  --teal:#5DC1B2; --teal-soft:#10312E;
  --blue:#9AA8E4; --blue-soft:#1B2044;
  --plum:#D48FCE; --plum-soft:#32162F;
  --danger:#E4867F;
  --scrim:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 28px -18px rgba(0,0,0,.9);
  color-scheme:dark;
}
/* 小 15px 接近 v0.8 的密度；中 17px 是預設（Tiffany：字體需放大）；大 19px 給遠一點看 */
html{font-size:17px}
html[data-font-size="small"]{font-size:15px}
html[data-font-size="large"]{font-size:19px}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:1rem;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.5}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.spacer{flex:1}
.wrap{max-width:86rem;margin:0 auto;padding-inline:max(16px,1rem);padding-block:0 3rem}

/* ---------- 上方品牌列 ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:86rem;margin:0 auto;padding-inline:max(16px,1rem);padding-block:.7rem;display:flex;flex-direction:column;gap:.6rem}
.brandline{display:flex;align-items:center;gap:.6rem .75rem;flex-wrap:wrap}
.brand{font-family:var(--serif);font-weight:700;font-size:1.25rem;letter-spacing:.02em;white-space:nowrap}
.brand .lamp{color:var(--accent)}
.sub{font-size:.72rem;color:var(--muted);letter-spacing:.14em;white-space:nowrap}
.mode{font-family:var(--mono);font-size:.7rem;letter-spacing:.06em;padding:.15rem .55rem;border-radius:999px;border:1px solid var(--line-2);color:var(--muted);white-space:nowrap}
.savestate{font-size:.78rem;color:var(--muted);white-space:nowrap}
.savestate.err{color:var(--danger);white-space:normal}

/* 字級：小／中／大 */
.seg{display:inline-flex;align-items:center;gap:.1rem;padding:.12rem;border:1px solid var(--line-2);border-radius:999px;background:var(--card)}
.seg-l{font-size:.74rem;letter-spacing:.12em;color:var(--muted);padding-inline:.55rem .2rem}
.seg button{border:0;background:transparent;color:var(--ink-2);border-radius:999px;min-width:1.9rem;padding:.12rem .45rem;font-size:.86rem;line-height:1.5}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:700}

/* ---------- 共用元件 ---------- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.inp{width:100%;min-width:0;background:var(--paper);border:1px solid var(--line-2);border-radius:var(--r);padding:.5rem .7rem;line-height:1.5}
.inp::placeholder{color:var(--muted);opacity:.75}
.inp:focus{border-color:var(--accent);background:var(--card);outline:none}
.btn{border:1px solid var(--line-2);background:var(--card);border-radius:var(--r);padding:.5rem .9rem;white-space:nowrap;line-height:1.4;font-size:.94rem;transition:background .12s,border-color .12s}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:500}
.btn-primary:hover:not(:disabled){filter:brightness(1.06)}
.btn-ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn-ghost:hover:not(:disabled){background:var(--inset);border-color:var(--line)}
.btn-sm{padding:.3rem .65rem;font-size:.84rem}
.btn-danger{color:var(--danger)}
.btn[data-armed]{background:var(--danger);border-color:var(--danger);color:var(--card);opacity:1}
.chips{display:flex;flex-wrap:wrap;gap:.35rem}
.chip{border:1px solid var(--line-2);background:transparent;border-radius:999px;padding:.18rem .7rem;font-size:.86rem;line-height:1.5;color:var(--ink-2)}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.tag{font-size:.78rem;border:1px solid var(--line-2);border-radius:999px;padding:.05rem .55rem;color:var(--ink-2);white-space:nowrap}
.tag-r{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft)}
.count{font-family:var(--mono);font-size:.76rem;color:var(--accent-ink);background:var(--accent-soft);padding:.05rem .45rem;border-radius:999px}
.since{font-family:var(--mono);font-size:.8rem}
.since.warn{color:var(--accent-ink)}
.since.cold{color:var(--danger)}
.hint{font-size:.78rem;color:var(--muted)}
.empty{padding:2rem 1rem;text-align:center;color:var(--muted);font-size:.9rem;margin:0}
/* 日期欄平常像紀錄，日曆圖示滑過或點進去才出現 */
.edit[type="date"]::-webkit-calendar-picker-indicator{opacity:0;cursor:pointer;transition:opacity .12s}
.edit[type="date"]:hover::-webkit-calendar-picker-indicator,.edit[type="date"]:focus::-webkit-calendar-picker-indicator{opacity:.6}

/* ---------- 首頁：一欄置中 ---------- */
.home{max-width:62rem;margin:0 auto;padding-top:1.4rem;display:grid;gap:1.2rem;container-type:inline-size;container-name:home}
.home>*{min-width:0}

/* 搜尋卡：姓名、電話、生日、進階搜尋，由上到下四列 */
.finder{overflow:hidden}
.frow{display:grid;grid-template-columns:6.2rem minmax(0,1fr);align-items:center;column-gap:1rem;padding:.7rem 1.1rem;border-bottom:1px solid var(--line)}
.flabel{font-size:.86rem;letter-spacing:.14em;color:var(--muted);white-space:nowrap}
.frow-adv{align-items:start}
.frow-adv>.flabel{padding-top:.55rem}
/* 第四列分成三格：當月壽星｜來的理由｜來訪日期 */
.acells{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr) minmax(0,auto);gap:.6rem}
.acell{border:1px solid var(--line-2);border-radius:var(--r);padding:.45rem .75rem .6rem;display:grid;gap:.4rem;align-content:start;min-width:0;transition:background .12s,border-color .12s}
.acell[data-on="1"]{border-color:var(--accent);background:var(--accent-wash)}
.ahead{display:flex;align-items:baseline;gap:.5rem;font-size:.78rem;letter-spacing:.12em;color:var(--muted);white-space:nowrap}
.alinks{margin-left:auto;display:flex;gap:.7rem}
.alink{border:0;background:none;padding:0;color:var(--accent-ink);font-size:.78rem;letter-spacing:.02em;text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px}
.alink:hover{text-decoration-color:var(--accent)}
.daterange{display:flex;align-items:center;gap:.45rem;flex-wrap:wrap}
.daterange .inp{width:9.4rem;padding:.25rem .5rem;font-family:var(--mono);font-size:.86rem;font-variant-numeric:tabular-nums}
.daterange>span{color:var(--muted);font-size:.86rem}
.ffoot{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;padding:.55rem 1.1rem;background:var(--inset);font-size:.82rem;color:var(--muted)}

/* 搜尋結果 */
.listhead{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin-bottom:.55rem}
.listhead h2,.bdayhead h2{margin:0;font-size:.8rem;letter-spacing:.16em;color:var(--muted);font-weight:500}
:root{--hitcols:2.6rem minmax(6.5rem,1.25fr) minmax(6.6rem,.9fr) minmax(5.6rem,.7fr) minmax(8.2rem,1.05fr) minmax(6.5rem,1.1fr)}
.results{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.cols{display:grid;grid-template-columns:var(--hitcols);gap:.75rem;padding:.55rem .9rem;font-size:.76rem;letter-spacing:.1em;color:var(--muted);border-bottom:1px solid var(--line);background:var(--inset)}
.hit{display:grid;grid-template-columns:var(--hitcols);gap:.75rem;padding:.55rem .9rem;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);align-items:center}
.hit:last-child{border-bottom:0}
.hit:hover{background:var(--inset)}
.thumb{width:2.6rem;height:2.6rem;border-radius:8px;object-fit:cover;background:var(--inset);border:1px solid var(--line)}
.thumb-ph{display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:1rem;color:var(--muted)}
.c-name{display:flex;flex-direction:column;min-width:0}
.c-name b{font-weight:500;font-size:1rem;overflow-wrap:anywhere}
.c-name span{font-family:var(--mono);font-size:.74rem;color:var(--muted);letter-spacing:.03em}
.c-num{font-family:var(--mono);font-size:.84rem;font-variant-numeric:tabular-nums;color:var(--ink-2);min-width:0;overflow-wrap:anywhere}
.c-line{font-size:.74rem;color:var(--muted)}
.c-last{display:flex;flex-direction:column;min-width:0}
.c-last>span:first-child{font-family:var(--mono);font-size:.84rem;font-variant-numeric:tabular-nums}
.c-tags{display:flex;flex-wrap:wrap;gap:.25rem;min-width:0}
.more{padding:.6rem .9rem;font-size:.82rem;color:var(--muted);background:var(--inset);border-top:1px solid var(--line);margin:0}

/* 今日壽星 */
.bdaybox{border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:.8rem 1.1rem;box-shadow:var(--shadow)}
.bdaybox.on{border-color:var(--accent);background:var(--accent-wash)}
.bdayhead{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.bdaybox.on .bdayhead h2{color:var(--accent-ink)}
.bdaydate,.bdayvia{font-family:var(--mono);font-size:.78rem;color:var(--muted)}
.bdaynone{font-size:.86rem;color:var(--muted)}
.bdaylist{list-style:none;margin:.6rem 0 0;padding:0;display:grid;gap:.4rem}
.bdaylist li{display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap}
.bdayname{font-family:var(--serif);font-size:1.12rem;font-weight:700;color:var(--accent-ink);background:transparent;border:0;border-bottom:1px solid var(--accent);padding:0 1px 1px}
.bdayname:hover{color:var(--ink)}
.bdayage{font-size:.8rem;color:var(--muted)}
.bdaysoon{margin-top:.45rem;font-size:.84rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:.2rem .9rem}
.bdaysoon button{border:0;background:none;padding:0;color:var(--ink-2);font-size:.84rem}
.bdaysoon button:hover{color:var(--accent-ink);text-decoration:underline}
.bdaysoon .d{font-family:var(--mono);font-size:.76rem;color:var(--muted);margin-left:.25rem}

/* ---------- 個案頁 ---------- */
.casebar{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.casebar .cname{font-family:var(--serif);font-size:1.2rem;font-weight:700}
.casebar .ccode{font-family:var(--mono);font-size:.76rem;color:var(--accent-ink);background:var(--accent-soft);padding:.1rem .45rem;border-radius:5px}
.casebar .tools{display:flex;gap:.3rem;margin-left:auto;flex-wrap:wrap}
.casebar .nav{display:flex;gap:.4rem;align-items:center}
.casebar .pos{font-family:var(--mono);font-size:.76rem;color:var(--muted);margin-right:.2rem;white-space:nowrap}
#caseView{padding-top:1.1rem;container-type:inline-size;container-name:sheet}

.sheet{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,1fr);overflow:hidden}
.cell{padding:1rem 1.15rem;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0;display:flex;flex-direction:column}
.cell:nth-child(2){border-right:0}
/* Tiffany：基本資料與大方向所在的上半區，合計約占螢幕一半 */
.cell.top{min-height:max(18rem,46vh)}
.cell.wide{grid-column:1/-1;border-right:0;border-bottom:0}
.cell-h{display:flex;align-items:center;gap:.5rem;margin-bottom:.75rem}
.cell-h h3{margin:0;font-size:.8rem;letter-spacing:.16em;color:var(--muted);font-weight:500}

/* 可直接改的欄位：平常像紀錄，滑過才露出邊框 */
.edit{border:1px solid transparent;background:transparent;border-radius:6px;padding:.1rem .4rem}
.edit:hover{border-color:var(--line-2)}
.edit:focus{border-color:var(--accent);background:var(--card);outline:none}

.idcard{display:grid;grid-template-columns:7.2rem minmax(0,1fr);gap:1.1rem;align-items:start}
.photobox{display:grid;gap:.45rem}
/* 客戶編號在基本資料左上方、照片正上方 */
.codeinp{font-family:var(--mono);font-size:.86rem;font-variant-numeric:tabular-nums;letter-spacing:.04em;color:var(--accent-ink);background:var(--accent-soft);width:100%;text-align:center;padding-block:.15rem}
.codeinp:hover,.codeinp:focus{background:var(--accent-soft)}
.photo{width:100%;aspect-ratio:3/4;max-width:100%;border-radius:8px;object-fit:cover;background:var(--inset);border:1px solid var(--line-2);display:block}
.photo-ph{display:flex;align-items:center;justify-content:center;text-align:center;font-size:.76rem;color:var(--muted);padding:.4rem}
.photobox .btn{width:100%}
.idmain{min-width:0;display:grid;gap:.55rem;align-content:start}
.nameinp{font-family:var(--serif);font-size:1.55rem;font-weight:700;letter-spacing:.02em;width:min(100%,11em);margin-left:-.4rem;line-height:1.3}
/* 基本資料兩欄：標籤｜內容｜標籤｜內容 */
.facts{display:grid;grid-template-columns:max-content minmax(0,1fr) max-content minmax(0,1fr);gap:.1rem .45rem;align-items:center}
.facts .fl{color:var(--muted);font-size:.84rem;white-space:nowrap}
.facts .fl.c2{padding-left:.9rem}
.factinp{width:100%;min-width:0;font-size:.95rem}
.factinp.num{font-family:var(--mono);font-size:.9rem;font-variant-numeric:tabular-nums}
.ro{color:var(--ink-2);font-family:var(--mono);font-size:.9rem;font-variant-numeric:tabular-nums;padding-left:.45rem;line-height:2}
.reasons{display:flex;flex-wrap:wrap;align-items:center;gap:.35rem}
.rlabel{font-size:.78rem;letter-spacing:.12em;color:var(--muted);margin-right:.25rem}
.cellfoot{margin-top:auto;padding-top:.8rem;display:flex;justify-content:flex-end}

/* 大方向：手寫欄，格線落在每行字的下方 */
.ta{width:100%;flex:1 1 auto;background:var(--inset);border:1px solid var(--line);border-radius:8px;padding:.6rem .8rem;resize:vertical;min-height:9rem;font-size:1rem}
.ta:focus{border-color:var(--accent);background:var(--card);outline:none}
.ta.lined{--lh:1.85rem;line-height:var(--lh);background-image:repeating-linear-gradient(transparent 0 calc(var(--lh) - 1px),var(--line-2) calc(var(--lh) - 1px) var(--lh));background-attachment:local;background-position:0 .6rem}

/* 來訪紀錄＋當次備註：一次來訪一列，底線從日期一路走到備註；右半對齊上方「大方向」那一欄 */
.vrow{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,1fr);column-gap:2.58rem;row-gap:.1rem;align-items:start;padding-block:.35rem;border-bottom:1px solid var(--line)}
.vhead{padding-block:0 .4rem;font-size:.76rem;letter-spacing:.1em;color:var(--muted)}
.vhead .h-item,.vhead .h-note{padding-left:.45rem}
.vhead .hc{text-align:center}
.vleft{display:grid;grid-template-columns:8rem repeat(3,2.9rem) minmax(0,1fr) 5rem;column-gap:.4rem;align-items:start}
.vright{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:.4rem;align-items:start}
.vbox{min-height:2rem;display:flex;align-items:center}
.vbox.c{justify-content:center}
.vempty{padding:.9rem 0;color:var(--muted);font-size:.9rem;border-bottom:1px solid var(--line);margin:0}
.vdate{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:.86rem}
.vseq{font-family:var(--mono);font-size:.72rem;color:var(--muted);margin-right:.45rem}
.edit.vin{width:100%;min-width:0;font-size:.92rem;line-height:1.4rem;padding:.25rem .4rem}
.edit.vin.fee{font-family:var(--mono);font-variant-numeric:tabular-nums}
.edit.vnote{display:block;width:100%;min-width:0;min-height:2rem;font-size:1rem;line-height:1.6;padding:.2rem .4rem;resize:none;overflow:hidden;field-sizing:content}
.vdel{color:var(--danger);opacity:0;transition:opacity .12s}
.vrow:hover .vdel,.vrow:focus-within .vdel,.vdel[data-armed]{opacity:1}
@media (hover:none){.vdel{opacity:1}}
.tick{appearance:none;width:1.05rem;height:1.05rem;border:1.5px solid var(--line-2);border-radius:4px;display:inline-grid;place-content:center;vertical-align:middle;margin:0;background:var(--card)}

      });
      c.reasons=out;
      c.visits=c.visits||[];
    });
    return list;
  }
  function saveLocal(){ try{ localStorage.setItem(LS,JSON.stringify(clients)); }catch(e){} }
  function loadLocal(){
    try{ var raw=localStorage.getItem(LS); if(!raw)return null; var v=JSON.parse(raw); return Array.isArray(v)&&v.length?v:null; }
    catch(e){ return null; }
  }

  var clients = migrate(clone(SEED));
  var local = loadLocal();
  if(local) clients = migrate(local);
  var db = null, queue = Promise.resolve(), listeners = [];

  function find(id){ for(var i=0;i<clients.length;i++){ if(clients[i].id===id)return i; } return -1; }
  function put(c){
    saveLocal();
    if(!db)return;
    var body=clone(c); body.updatedAt=new Date().toISOString();
    queue=queue.then(function(){ return db.doc("clients/"+c.id).set(body); }).catch(function(){});
  }
  /* 客戶編號：139-00001 起跳，取現有最大號 +1 */
  function nextCode(){
    var max=0;
    clients.forEach(function(c){ var m=/^139-(\d+)$/.exec(c.code||""); if(m){ var n=parseInt(m[1],10); if(n>max)max=n; } });
    return "139-"+String(max+1).padStart(5,"0");
  }
  /* 示範稿的照片存在資料裡，所以縮成 360×480 */
  function smallPhoto(bytes){
    return new Promise(function(resolve,reject){
      var url=URL.createObjectURL(new Blob([bytes],{type:"image/jpeg"}));
      var img=new Image();
      img.onload=function(){
        var cv=document.createElement("canvas"); cv.width=360; cv.height=480;
        cv.getContext("2d").drawImage(img,0,0,360,480);
        URL.revokeObjectURL(url);
        resolve(cv.toDataURL("image/jpeg",0.72));
      };
      img.onerror=function(){ URL.revokeObjectURL(url); reject(new Error("照片讀不出來")); };
      img.src=url;
    });
  }

  window.hopelight = {
    info: function(){
      return Promise.resolve({version:VERSION, dataDir:"", features:{}, demo:{
        mode:"虛構示範資料",
        note:"畫面中的姓名、電話與紀錄皆為虛構示範資料，不是真實個案。在這裡的修改只是試用，不會進入正式版。",
        credit:"製作：Darren → mamasan"}});
    },
    listClients: function(){ return Promise.resolve(clone(clients)); },
    createClient: function(input){
      var c=clone(input);
      if(!String(c.name||"").trim())return Promise.reject(new Error("姓名不能空白。"));
      c.id=uid("c"); c.code=nextCode(); c.photo=""; c.thumb="";
      c.visits=(c.visits||[]).map(function(v){ v.id=v.id||uid("v"); return v; });
      clients.push(c); put(c);
      return Promise.resolve(clone(c));
    },
    saveClient: function(client){
      var c=clone(client), i=find(c.id);
      if(i<0)return Promise.reject(new Error("找不到這位個案，可能已經被刪除。"));
      clients[i]=c; put(c);
      return Promise.resolve(clone(c));
    },
    deleteClient: function(id){
      var i=find(id); if(i<0)return Promise.resolve(false);
      clients.splice(i,1); saveLocal();
      if(db) queue=queue.then(function(){ return db.doc("clients/"+id).delete(); }).catch(function(){});
      return Promise.resolve(true);
    },
    setPhoto: function(id,images){
      return smallPhoto(images.photo).then(function(url){
        var i=find(id); if(i<0)throw new Error("找不到這位個案，照片沒有存。");
        clients[i].photo=url; clients[i].thumb=url; put(clients[i]);
        return {photo:url, thumb:url};
      });
    },
    onBeforeClose: function(){},
    closeReady: function(){},
    onClientsChanged: function(cb){ listeners.push(cb); }
  };

  /* 連上 Artifact 資料庫：第一次是空的就把示範資料放上去，之後以雲端那份為準 */
  if(window.claude&&typeof window.claude.use==="function"){
    window.claude.use("db").then(function(d){
      if(!d)return;
      db=d;
      db.collection("clients").onSnapshot(function(snap){
        if(snap.empty){ clients.forEach(put); return; }
        clients=migrate(snap.docs.map(function(x){ var o=x.data()||{}; o.id=x.id; return o; }));
        saveLocal();
        listeners.forEach(function(cb){ cb(clone(clients)); });
      },function(){});
    }).catch(function(){});
  }
})();
</script>
<script>
"use strict";
/* 希望之光個案檢索：畫面。正式版與示範稿（v0.9 起）共用這一份，scripts/build-demo.js 會把它包進示範稿。
   資料一律經 window.hopelight：
   - 正式版由 preload 提供，存進本機 SQLite；
   - 示範稿由 scripts/demo-api.js 提供，只有虛構資料。
   info().features 說明這一邊有哪些功能（設定與備份、列印、開啟密碼、自動更新）；沒有的就不顯示按鈕。 */
var api = window.hopelight;

/* ---------- constants ---------- */
var REASONS = ["感情","事業","親子","金錢","多元"];
var TYPES = [{k:"initial",label:"初評",cls:"i"},{k:"follow",label:"複評",cls:"f"},{k:"course",label:"課程",cls:"c"}];
/* 新增客戶時自動建立的第一次來訪；價格調整時改這裡 */
var FIRST_VISIT_DEFAULT = {item:"腦意識評量", fee:"2980"};
/* 結果一次最多列這麼多位，其餘請她加條件縮小 */
var RESULT_LIMIT = 200;

/* ---------- state ---------- */
var state = {
  clients: [],
  selectedId: null,
  q: {name:"", phone:"", birthday:""},
  adv: {birthMonth:false, from:"", to:"", reasons:[]},
  view: "home",
  loaded: false,
  locked: false,
  info: {version:"", dataDir:"", features:{}}
};
function has(f){ return !!(state.info.features&&state.info.features[f]); }

/* ---------- utils ---------- */
function el(id){return document.getElementById(id);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function digits(s){return String(s||"").replace(/\D/g,"");}
function lastVisitDate(c){var d="";(c.visits||[]).forEach(function(v){if(v.date>d)d=v.date;});return d;}
function age(b){if(!b)return"";var t=new Date(),d=new Date(b);if(isNaN(d))return"";var a=t.getFullYear()-d.getFullYear();var m=t.getMonth()-d.getMonth();if(m<0||(m===0&&t.getDate()<d.getDate()))a--;return a>=0&&a<130?a:"";}
function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function today(){return ymd(new Date());}
function newVisitId(){return crypto.randomUUID();}
function mmdd(d){ return String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function bdayKey(c){ return (c.birthday||"").slice(5); }
function thisMonth(){ return mmdd(new Date()).slice(0,2); }
function monthsSince(dateStr){
  if(!dateStr)return Infinity;
  var d=new Date(dateStr); if(isNaN(d))return Infinity;
  var n=new Date();
  var m=(n.getFullYear()-d.getFullYear())*12+(n.getMonth()-d.getMonth());
  if(n.getDate()<d.getDate())m--;
  return m<0?0:m;
}
function sinceLabel(dateStr){
  if(!dateStr)return "尚未來訪";
  var m=monthsSince(dateStr);
  if(m===Infinity)return "尚未來訪";
  if(m<1)return "本月來過";
  if(m<12)return m+" 個月沒來";
  var y=Math.floor(m/12), r=m%12;
  return y+" 年"+(r?r+" 個月":"")+"沒來";
}
/* 滿三個月轉琥珀、滿半年轉紅（v0.2 Tiffany 要的「多久沒來」，改成直接標在每一位旁邊） */
function sinceClass(dateStr){
  var m=monthsSince(dateStr);
  return m>=6?"since cold":m>=3?"since warn":"since";
}
function currentClient(){for(var i=0;i<state.clients.length;i++){if(state.clients[i].id===state.selectedId)return state.clients[i];}return null;}
function byId(id){for(var i=0;i<state.clients.length;i++){if(state.clients[i].id===id)return state.clients[i];}return null;}
function errText(err){ return String((err&&err.message)||err||"").replace(/^Error invoking remote method '[^']+': (?:Error: )?/,""); }

/* ---------- 字級：小／中／大，只記在這台電腦 ---------- */
var FONT_PREF_KEY="hopelight-font-size";
var FONT_SIZES=["small","medium","large"];
function savedFontSize(){
  try{ var v=localStorage.getItem(FONT_PREF_KEY); return FONT_SIZES.indexOf(v)>=0?v:"medium"; }
  catch(e){ return "medium"; }
}
function applyFontSize(size,save){
  var value=FONT_SIZES.indexOf(size)>=0?size:"medium";
  document.documentElement.dataset.fontSize=value;
  Array.prototype.forEach.call(document.querySelectorAll("[data-font-size]"),function(b){
    if(b.tagName==="BUTTON")b.setAttribute("aria-pressed",String(b.dataset.fontSize===value));
  });
  if(save){ try{ localStorage.setItem(FONT_PREF_KEY,value); }catch(e){} }
  fitNotes();
}

/* 當次備註跟著字數往下撐開；支援 field-sizing 的瀏覽器由 CSS 處理，這裡是其他瀏覽器的備援 */
var FIT_BY_CSS = !!(window.CSS&&CSS.supports&&CSS.supports("field-sizing","content"));
function fitNote(ta){
  if(FIT_BY_CSS||!ta.offsetParent)return;
  ta.style.height="auto";
  ta.style.height=(ta.scrollHeight+2)+"px";
}
function fitNotes(){ Array.prototype.forEach.call(document.querySelectorAll("#sheet .vnote"),fitNote); }
/* 刪除、還原這類動作要按兩次：第一次按鈕變紅並說明後果，4 秒內再按才生效 */
function armed(btn,label){
  if(btn.dataset.armed)return true;
  btn.dataset.armed="1"; btn.dataset.orig=btn.textContent; btn.textContent=label;
  setTimeout(function(){
    if(btn.isConnected&&btn.dataset.armed){ delete btn.dataset.armed; btn.textContent=btn.dataset.orig; }
  },4000);
  return false;
}

/* ---------- persistence ---------- */
var saving = {};      /* 每位個案一條儲存佇列，照順序寫進資料庫 */
var pending = null;   /* 還在等打字停下來才存的那一位 */
var noteTimer = null;
var flagTimer = null;
function flag(msg,isErr){
  var s=el("saveState"); if(!s)return;
  s.textContent=msg; s.classList.toggle("err",!!isErr);
  clearTimeout(flagTimer);
  if(msg&&!isErr) flagTimer=setTimeout(function(){s.textContent="";},2200);
}
function persist(client){
  if(!client)return;
  var id=client.id;
  flag("儲存中…");
  saving[id]=(saving[id]||Promise.resolve()).then(function(){ return api.saveClient(client); })
    .then(function(){ flag("已儲存"); },function(err){ flag("沒有存到："+errText(err),true); });
}
function removeClient(id){
  return api.deleteClient(id).then(function(){ flag("已刪除"); },function(err){ flag("刪除失敗："+errText(err),true); });
}
/* 關視窗、上鎖、列印前：把還在等的編輯立刻存，並等所有儲存完成 */
function flushPending(){
  if(pending){ clearTimeout(noteTimer); var c=pending; pending=null; persist(c); }
  return Promise.all(Object.keys(saving).map(function(k){ return saving[k]; }));
}

/* ---------- search ---------- */
function matches(c){
  var q=state.q,a=state.adv;
  if(q.name && (c.name||"").indexOf(q.name.trim())<0) return false;
  if(q.phone){ if(digits(c.phone).indexOf(digits(q.phone))<0) return false; }
  if(q.birthday){
    var d=digits(q.birthday);
    if(d){ if(digits(c.birthday).indexOf(d)<0) return false; }
    else if((c.birthday||"").indexOf(q.birthday.trim())<0) return false;
  }
  if(a.birthMonth && bdayKey(c).slice(0,2)!==thisMonth()) return false;
  if(a.reasons.length){
    var hit=false;
    for(var i=0;i<a.reasons.length;i++){ if((c.reasons||[]).indexOf(a.reasons[i])>=0){hit=true;break;} }
    if(!hit) return false;
  }
  if(a.from||a.to){
    var ok=false;
    (c.visits||[]).forEach(function(v){
      if(a.from && v.date < a.from) return;
      if(a.to && v.date > a.to) return;
      ok=true;
    });
    if(!ok) return false;
  }
  return true;
}
function results(){
  return state.clients.filter(matches).sort(function(x,y){
    var a=lastVisitDate(x),b=lastVisitDate(y);
    return a<b?1:a>b?-1:0;
  });
}
function activeFilterCount(){
  var a=state.adv,n=0;
  if(a.birthMonth)n++;
  if(a.from||a.to)n++;
  if(a.reasons.length)n++;
  return n;
}
function hasSearchFilters(){
  var q=state.q;
  return !!(q.name.trim()||q.phone.trim()||q.birthday.trim()||activeFilterCount());
}

/* ---------- render: 搜尋卡第四列「進階搜尋」三格 ---------- */
function renderAdv(){
  var a=state.adv, mon=new Date().getMonth()+1, monN=0;
  state.clients.forEach(function(c){ if(bdayKey(c).slice(0,2)===thisMonth())monN++; });
  var allOn=a.reasons.length===REASONS.length;
  el("advCells").innerHTML=
    '<div class="acell" data-on="'+(a.birthMonth?1:0)+'">'+
      '<span class="ahead">當月壽星</span>'+
      '<div class="chips"><button class="chip" type="button" data-birthmonth="1" aria-pressed="'+a.birthMonth+'">'+mon+' 月壽星（'+monN+'）</button></div>'+
    '</div>'+
    '<div class="acell" data-on="'+(a.reasons.length?1:0)+'">'+
      '<span class="ahead">來的理由<span class="alinks"><button class="alink" type="button" data-allreasons="1">'+(allOn?"全部取消":"全選")+'</button></span></span>'+
      '<div class="chips">'+REASONS.map(function(r){
        return '<button class="chip" type="button" data-reason="'+esc(r)+'" aria-pressed="'+(a.reasons.indexOf(r)>=0)+'">'+esc(r)+'</button>';
      }).join("")+'</div>'+
    '</div>'+
    '<div class="acell" data-on="'+((a.from||a.to)?1:0)+'">'+
      '<span class="ahead">來訪日期<span class="alinks">'+
        '<button class="alink" type="button" data-range="90">近三個月</button>'+
        '<button class="alink" type="button" data-range="365">近一年</button></span></span>'+
      '<div class="daterange">'+
        '<input class="inp" type="date" id="aFrom" value="'+esc(a.from)+'" aria-label="來訪日期：從">'+
        '<span>至</span>'+
        '<input class="inp" type="date" id="aTo" value="'+esc(a.to)+'" aria-label="來訪日期：到">'+
      '</div>'+
    '</div>';
  el("btnClear").disabled=!hasSearchFilters();
  el("finderNote").textContent=state.loaded?"共 "+state.clients.length+" 位個案　·　填任一格就會列出符合的個案":"讀取中…";
}

/* ---------- render: 搜尋結果（沒有條件時不列，免得上千位全部攤開） ---------- */
function renderResults(){
  var filtered=hasSearchFilters();
  var holder=el("searchResults"), box=el("results");
  holder.hidden=!filtered;
  el("btnClear").disabled=!filtered;
  if(!filtered){ box.innerHTML=""; return; }
  var list=results();
  el("resCount").textContent=list.length;
  el("resHint").textContent=list.length?"最近來訪的在前　·　點一位開啟完整紀錄":"";
  if(!state.clients.length){ box.innerHTML='<p class="empty">'+(state.loaded?'還沒有任何個案。<br>按右上「＋ 新增客戶」建立第一位。':'讀取中…')+'</p>'; return; }
  if(!list.length){ box.innerHTML='<p class="empty">沒有符合條件的個案。<br>試著只留一個條件，或按「清除條件」重來。</p>'; return; }
  var shown=list.slice(0,RESULT_LIMIT);
  box.innerHTML=
    '<div class="cols" aria-hidden="true"><span></span><span>姓名／編號</span><span>電話／LINE</span><span>生日</span><span>最近來訪</span><span>來的理由</span></div>'+
    shown.map(function(c){
      var lv=lastVisitDate(c), pic=c.thumb||c.photo;
      return '<button class="hit" type="button" data-id="'+esc(c.id)+'">'+
        (pic?'<img class="thumb" src="'+esc(pic)+'" alt="">':'<span class="thumb thumb-ph" aria-hidden="true">'+esc((c.name||"？").slice(0,1))+'</span>')+
        '<span class="c-name"><b>'+esc(c.name)+'</b><span>'+esc(c.code)+'</span></span>'+
        '<span class="c-num">'+esc(c.phone||"—")+(c.lineId?'<br><span class="c-line">LINE '+esc(c.lineId)+'</span>':'')+'</span>'+
        '<span class="c-num">'+esc(c.birthday||"—")+'</span>'+
        '<span class="c-last"><span>'+esc(lv||"—")+'　共 '+(c.visits||[]).length+' 次</span>'+
          '<span class="'+sinceClass(lv)+'">'+esc(sinceLabel(lv))+'</span></span>'+
        '<span class="c-tags">'+((c.reasons||[]).length?c.reasons.map(function(r){return '<span class="tag tag-r">'+esc(r)+'</span>';}).join(""):'<span class="tag">未填</span>')+'</span>'+
      '</button>';
    }).join("")+
    (list.length>RESULT_LIMIT?'<p class="more">還有 '+(list.length-RESULT_LIMIT)+' 位沒有列出。多加一個條件，就能縮小範圍。</p>':'');
}

/* ---------- render: 今日壽星（她每天照這張名單傳訊息） ---------- */
function renderBirthdays(){
  var box=el("bday"); if(!box)return;
  var now=new Date(), md=mmdd(now), mon=md.slice(0,2);
  var hoy=[], soon=[];
  state.clients.forEach(function(c){
    var k=bdayKey(c); if(!k)return;
    if(k===md)hoy.push(c);
    else if(k.slice(0,2)===mon&&k>md)soon.push(c);
  });
  soon.sort(function(a,b){ return bdayKey(a)<bdayKey(b)?-1:1; });
  var later=soon.length?'<div class="bdaysoon"><span>本月接下來：</span>'+soon.map(function(c){
      return '<button type="button" data-open="'+esc(c.id)+'">'+esc(c.name)+'<span class="d">'+esc(bdayKey(c).replace("-","/"))+'</span></button>';
    }).join("")+'</div>':'';
  if(hoy.length){
    box.className="bdaybox on";
    box.innerHTML='<div class="bdayhead"><h2>今 日 壽 星</h2><span class="count">'+hoy.length+'</span>'+
      '<span class="bdaydate">'+esc(ymd(now))+'</span></div>'+
      '<ul class="bdaylist">'+hoy.map(function(c){
        return '<li><button class="bdayname" type="button" data-open="'+esc(c.id)+'">'+esc(c.name)+'</button>'+
          '<span class="bdayage">'+(age(c.birthday)!==""?age(c.birthday)+" 歲":"")+'</span>'+
          '<span class="bdayvia">'+(c.lineId?'LINE '+esc(c.lineId):'')+(c.lineId&&c.phone?'　·　':'')+esc(c.phone||"")+'</span></li>';
      }).join("")+'</ul>'+later;
  } else {
    box.className="bdaybox";
    box.innerHTML='<div class="bdayhead"><h2>今 日 壽 星</h2><span class="bdaydate">'+esc(ymd(now))+'</span>'+
      '<span class="bdaynone">今天沒有壽星</span></div>'+later;
  }
}

/* ---------- 兩個畫面的切換 ---------- */
function renderView(){
  var isCase = state.view==="case" && currentClient();
  el("homeView").hidden=!!isCase;
  document.querySelector("main.wrap").classList.toggle("at-home",!isCase);
  el("caseBar").hidden=!isCase;
  el("caseView").hidden=!isCase;
  if(!isCase){ el("caseBar").innerHTML=""; return; }
  var c=currentClient(), list=results(), pos=-1;
  list.forEach(function(x,i){ if(x.id===c.id)pos=i; });
  el("caseBar").innerHTML=
    '<button class="btn btn-sm" type="button" id="btnBack">← 回搜尋</button>'+
    '<span class="cname">'+esc(c.name)+'</span><span class="ccode">'+esc(c.code)+'</span>'+
    '<span class="tools">'+
      (has("print")?'<button class="btn btn-ghost btn-sm" type="button" id="btnPrint">列印</button>'+
                    '<button class="btn btn-ghost btn-sm" type="button" id="btnPdf">存成 PDF</button>':'')+
    '</span>'+
    '<span class="nav">'+
      (pos>=0?'<span class="pos">第 '+(pos+1)+' ／ '+list.length+' 位</span>':'')+
      '<button class="btn btn-sm" type="button" id="btnPrev"'+(pos<=0?' disabled':'')+'>上一位</button>'+
      '<button class="btn btn-sm" type="button" id="btnNext"'+(pos<0||pos>=list.length-1?' disabled':'')+'>下一位</button>'+
    '</span>';
}
function go(view,id){
  var target = (view==="case"&&id) ? "#/case/"+id : "#/";
  if(location.hash===target){ applyRoute(); return; }
  try{ location.hash=target; }
  catch(e){ state.view=view; if(id)state.selectedId=id; renderAll(); }
}
function applyRoute(){
  var h=(location.hash||"").replace(/^#\/?/,"");
  if(h.indexOf("case/")===0){
    var id=h.slice(5);
    if(byId(id)){ state.selectedId=id; state.view="case"; }
    else state.view="home";
  } else state.view="home";
  renderAll();
  window.scrollTo(0,0);
}

/* ---------- render: 個案紀錄表 ---------- */
var FACTS=[
  /* [標籤, 欄位, input type, 等寬數字, 提示] 兩欄排：生日｜年齡、電話｜LINE、性別｜職業、宗教｜首次來訪 */
  ["生　日","birthday","date",true,""],
  ["年　齡",null],
  ["電　話","phone","tel",true,""],
  ["LINE ID","lineId","text",false,"未填"],

function loadPhoto(f){
  if(!f)return;
  var img=new Image();
  img.onload=function(){ shot=crop(img); URL.revokeObjectURL(img.src); showShot(); };

  img.src=URL.createObjectURL(f);
}

/* 從中間裁成 3:4，存 720×960：夠列印個案頁，一張約一兩百 KB */
function crop(src){
  var w=src.naturalWidth||src.width, h=src.naturalHeight||src.height;
  var TW=720, TH=960, ratio=TW/TH;
  var sw=w, sh=Math.round(w/ratio);
  if(sh>h){ sh=h; sw=Math.round(h*ratio); }
  var sx=Math.round((w-sw)/2), sy=Math.round((h-sh)/2);
  var cv=document.createElement("canvas"); cv.width=TW; cv.height=TH;
  cv.getContext("2d").drawImage(src,sx,sy,sw,sh,0,0,TW,TH);
  return cv;
}
function scaled(cv,w,h){
  var out=document.createElement("canvas"); out.width=w; out.height=h;
  var g=out.getContext("2d"); g.imageSmoothingQuality="high"; g.drawImage(cv,0,0,w,h);
  return out;
}
function jpegBytes(cv,quality){
  return new Promise(function(resolve,reject){
    cv.toBlob(function(blob){
      if(!blob){ reject(new Error("照片轉檔失敗")); return; }
      blob.arrayBuffer().then(function(buf){ resolve(new Uint8Array(buf)); },reject);
    },"image/jpeg",quality);
  });
}

function findDupes(name,phone,birthday,lineId,excludeId){
  var out=[], nm=(name||"").trim(), ph=digits(phone), bd=(birthday||"").trim(),
      li=(lineId||"").trim().toLowerCase();
  state.clients.forEach(function(c){
    if(c.id===excludeId)return;
    var why=[];
    if(nm&&c.name===nm)why.push("同姓名");
    if(ph&&digits(c.phone)===ph)why.push("同電話");
    if(li&&(c.lineId||"").toLowerCase()===li)why.push("同 LINE ID");
    if(bd&&c.birthday===bd)why.push("同生日");
    if(!why.length)return;
    out.push({c:c,why:why,strong:why.indexOf("同電話")>=0||why.indexOf("同生日")>=0||why.indexOf("同 LINE ID")>=0});
  });
  return out;
}

function onSettingsChange(e){
  if(e.target.id==="idleSel"){
    var n=parseInt(e.target.value,10)||0;
    api.setIdleMinutes(n).then(function(v){ lockInfo.idleMinutes=v; flag("已儲存"); });

}
function onSettingsClick(e){
  var b=e.target.closest("button[data-act]"); if(!b)return;
  var act=b.dataset.act;
  if(act==="backup"){
    b.disabled=true; b.textContent="備份中…";
    flushPending().then(function(){ return api.backupNow(); }).then(function(r){
      renderSettings({text:"備份好了："+r.name+(r.copied?"；也存了一份到指定資料夾。":"。")+(r.copyError?"另存失敗："+r.copyError:"")});
    },function(err){ renderSettings({text:"備份失敗："+errText(err),err:true}); });
  } else if(act==="folder"){
    api.chooseBackupFolder().then(function(r){ if(r&&r.folder)renderSettings({text:"之後的備份也會存一份到這個資料夾。"}); });
  } else if(act==="nofolder"){
    api.clearBackupFolder().then(function(){ renderSettings(); });
  } else if(act==="openbackups"){ api.openFolder("backups");
  } else if(act==="opendata"){ api.openFolder("data");
  } else if(act==="restore"){
    api.pickRestore().then(function(r){ if(r)showRestore(r); },function(err){ renderSettings({text:errText(err),err:true}); });
  } else if(act==="restoreGo"){
    if(!armed(b,"再按一次：用這份備份取代目前的資料"))return;
    b.disabled=true; b.textContent="還原中…";
    flushPending().then(function(){ return api.restoreBackup(b.dataset.file); }).then(function(r){
      return reloadClients().then(function(){
        go("home");
        renderSettings({text:"還原好了，現在是 "+fmtTime(r.createdAt)+" 那份備份的內容（"+r.clients+" 位個案）。還原前的資料另存成備份「"+r.safety+"」。"});
      });
    },function(err){ renderSettings({text:"沒有還原："+errText(err),err:true}); });
  } else if(act==="export"){
    b.disabled=true; b.textContent="匯出中…";
    flushPending().then(function(){ return api.exportAll(); }).then(function(r){
      b.disabled=false; b.textContent="匯出全部資料…";
      if(!r)return;
      el("exportMsg").textContent="已匯出 "+r.clients+" 位、"+r.visits+" 次來訪。";
      api.openFolder("export");
    },function(err){ b.disabled=false; b.textContent="匯出全部資料…"; el("exportMsg").textContent="匯出失敗："+errText(err); });
  } else if(act==="setpw"||act==="changepw"){ showPasswordForm(act==="changepw");
  } else if(act==="clearpw"){ showClearPassword();
  } else if(act==="lock"){ closeModal(); lockNow();
  } else if(act==="checkupd"){
    el("updState").textContent="正在檢查…";
    api.checkForUpdates().then(function(u){ upd=u||upd; el("updState").textContent=updLabel(u); renderUpdate(); });
  }
}

function lockNow(){

function showLock(recover){
  el("lockRoot").innerHTML='<div class="lock" role="dialog" aria-modal="true" aria-label="已上鎖"><div class="panel lockcard">'+
    '<span class="brand">希望之光<span class="lamp">・</span>個案檢索</span>'+

        '<button class="btn btn-primary" type="submit">開啟</button>'+

    '</div></div>';
  var form=el("lockForm"), msg=el("lockMsg");
  form.addEventListener("submit",function(e){
    e.preventDefault();

    p.then(function(r){
      if(!r||!r.ok){ msg.textContent=recover?"復原碼不對，請再確認一次。":"密碼不對，請再試一次。"; msg.className="note err"; return; }

  });
  if(recover){ el("lockBack").addEventListener("click",function(){ showLock(false); }); el("rcCode").focus(); }
  else { el("lockForgot").addEventListener("click",function(){ showLock(true); }); el("lockPw").focus(); }
}
function afterUnlock(){
  state.locked=false; el("lockRoot").innerHTML=""; lastInput=Date.now();

}

/* ---------- boot ---------- */
function reloadClients(){
  return api.listClients().then(function(list){
    state.clients=list; state.loaded=true;
    if(!currentClient())state.selectedId=null;
  });
}
function showFatal(err){
  el("searchResults").hidden=false;
  el("results").innerHTML='<div class="fatal"><b>資料讀不出來</b><span>'+esc(errText(err))+'</span><span>請把這段文字截圖給 Darren。</span></div>';
}
applyFontSize(savedFontSize(),false);
renderAdv();
api.onBeforeClose(function(){
  flushPending().then(function(){ api.closeReady(); },function(){ api.closeReady(); });
});
if(api.onClientsChanged)api.onClientsChanged(function(list){
  /* 示範稿：別的裝置改了雲端資料。正在打字時只更新清單，不重畫紀錄表 */
  state.clients=list; state.loaded=true;
  var a=document.activeElement, editing=!!a&&(a.tagName==="TEXTAREA"||(a.tagName==="INPUT"&&a.closest("#sheet")));
  if(editing){ renderAdv(); renderBirthdays(); renderResults(); } else applyRoute();
});
api.info().then(function(info){
  state.info=info||state.info;
  renderFoot();
  if(has("update")){
    api.onUpdate(function(u){ upd=u||{}; renderUpdate(); var s=el("updState"); if(s)s.textContent=updLabel(upd); });
    api.updateStatus().then(function(u){ upd=u||{}; renderUpdate(); });
  }
  return has("lock")?api.lockStatus():null;
}).then(function(lock){
  if(lock){ lockInfo=lock; if(lock.locked){ state.locked=true; showLock(false); return; } }
  return reloadClients().then(applyRoute);
}).catch(showFatal);
applyRoute();
</script>
