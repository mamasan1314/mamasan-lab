<title>希望之光個案檢索</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  /* 取自 hopelight-candle21-lp.html（Tiffany 2026-09-06 認可的字色加深版） */
  --paper:#F1EFF3; --card:#FBFAFC; --inset:#F0EDF3;
  --ink:#15111F; --ink-2:#3A3450; --muted:#4B4560;
  --line:#D6D0DF; --line-2:#C3BBD0;
  --accent:#8A5A12; --accent-ink:#6B4409; --accent-soft:#E0CDA9; --accent-wash:#EFE6D5;
  --teal:#1F6E68; --teal-soft:#DDEBE8;
  --blue:#3F4A8C; --blue-soft:#E2E5F2;
  --plum:#8A3F86; --plum-soft:#F2E3F0;
  --danger:#A63636;
  --shadow:0 1px 2px rgba(32,28,46,.06), 0 8px 24px -18px rgba(32,28,46,.35);
  --r:10px;
  --mono:"IBM Plex Mono","Noto Sans TC",ui-monospace,monospace;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --serif:"Noto Serif TC","Songti TC",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#141120; --card:#1C1829; --inset:#241F33;
    --ink:#F3F0F8; --ink-2:#D6D1E4; --muted:#B5AECA;
    --line:#332E48; --line-2:#453E5C;
    --accent:#E4B064; --accent-ink:#F2D4A0; --accent-soft:#5A451F; --accent-wash:#2E2415;
    --teal:#5DC1B2; --teal-soft:#10312E;
    --blue:#9AA8E4; --blue-soft:#1B2044;
    --plum:#D48FCE; --plum-soft:#32162F;
    --danger:#E4867F;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 28px -18px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --paper:#141120; --card:#1C1829; --inset:#241F33;
  --ink:#F3F0F8; --ink-2:#D6D1E4; --muted:#B5AECA;
  --line:#332E48; --line-2:#453E5C;
  --accent:#E4B064; --accent-ink:#F2D4A0; --accent-soft:#5A451F; --accent-wash:#2E2415;
  --teal:#5DC1B2; --teal-soft:#10312E;
  --blue:#9AA8E4; --blue-soft:#1B2044;
  --plum:#D48FCE; --plum-soft:#32162F;
  --danger:#E4867F;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 28px -18px rgba(0,0,0,.9);
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px;padding-block:0 48px}

/* ---------- header ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1200px;margin:0 auto;padding:0 16px;padding-block:14px 12px;display:flex;flex-direction:column;gap:12px}
.brandline{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand{font-family:var(--serif);font-weight:700;font-size:19px;letter-spacing:.02em}
.brand .lamp{color:var(--accent)}
.sub{font-size:11.5px;color:var(--muted);letter-spacing:.14em}
.spacer{flex:1}
.mode{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;padding:3px 8px;border-radius:999px;border:1px solid var(--line-2);color:var(--muted);white-space:nowrap}
.mode[data-live="1"]{color:var(--teal);border-color:var(--teal);background:var(--teal-soft)}

.searchbar{display:grid;grid-template-columns:repeat(3,1fr) auto;gap:10px;align-items:end}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>label{font-size:11px;letter-spacing:.12em;color:var(--muted)}
.inp{width:100%;background:var(--card);border:1px solid var(--line-2);border-radius:var(--r);padding:9px 11px;min-width:0}
.inp::placeholder{color:var(--muted);opacity:.7}
.inp:focus{border-color:var(--accent)}
.btn{border:1px solid var(--line-2);background:var(--card);border-radius:var(--r);padding:9px 14px;cursor:pointer;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{border-color:var(--accent)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
:root[data-theme="dark"] .btn-primary,:root:not([data-theme="light"]) .btn-primary{color:#20180A}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .btn-primary{color:#fff}}
.btn-primary:hover{filter:brightness(1.06)}
.btn-ghost{border-color:transparent;background:transparent;color:var(--ink-2);padding:6px 8px}
.btn-ghost:hover{background:var(--inset);border-color:var(--line)}
.btn-sm{padding:5px 10px;font-size:12.5px}

.advtoggle{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.adv{border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:14px;display:grid;gap:14px;box-shadow:var(--shadow)}
.adv-row{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.adv-block{display:flex;flex-direction:column;gap:7px;min-width:0}
.adv-block>span{font-size:11px;letter-spacing:.12em;color:var(--muted)}
.daterange{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.daterange .inp{width:auto;min-width:140px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line-2);background:transparent;border-radius:999px;padding:4px 11px;font-size:12.5px;cursor:pointer;color:var(--ink-2)}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.chip.t-i[aria-pressed="true"]{background:var(--teal-soft);border-color:var(--teal);color:var(--teal)}
.chip.t-f[aria-pressed="true"]{background:var(--blue-soft);border-color:var(--blue);color:var(--blue)}
.chip.t-c[aria-pressed="true"]{background:var(--plum-soft);border-color:var(--plum);color:var(--plum)}

/* ---------- layout ---------- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.listhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:18px 9px}
.listhead h2{margin:0;font-size:12px;letter-spacing:.16em;color:var(--muted);font-weight:500}
.count{font-family:var(--mono);font-size:11.5px;color:var(--accent-ink);background:var(--accent-soft);padding:1px 7px;border-radius:999px}

/* 首頁：當日壽星 */
.bdaybox{border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:12px 14px;margin-top:18px;box-shadow:var(--shadow)}
.bdaybox.on{border-color:var(--accent);background:var(--accent-wash)}
.bdayhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bdayhead h2{margin:0;font-size:12px;letter-spacing:.16em;color:var(--muted);font-weight:500}
.bdaybox.on .bdayhead h2{color:var(--accent-ink)}
.bdaydate,.bdayvia{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.bdaynone{font-size:12.5px;color:var(--muted)}
.bdaylist{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:7px}
.bdaylist li{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.bdayname{font-family:var(--serif);font-size:16px;font-weight:700;color:var(--accent-ink);background:transparent;border:0;border-bottom:1px solid var(--accent);padding:0 1px 1px;cursor:pointer}
.bdayname:hover{color:var(--ink)}
.bdayage{font-size:12px;color:var(--muted)}
.c-line{font-size:11px;color:var(--muted)}

/* 首頁：個案清單 */
:root{--hitcols:42px minmax(108px,1.25fr) minmax(104px,.85fr) minmax(92px,.75fr) minmax(136px,1.05fr) minmax(112px,1.15fr)}
.results{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.cols{display:grid;grid-template-columns:var(--hitcols);gap:12px;padding:10px 14px;font-size:11px;letter-spacing:.1em;color:var(--muted);border-bottom:1px solid var(--line);background:var(--inset)}
.hit{display:grid;grid-template-columns:var(--hitcols);gap:12px;padding:9px 14px;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);cursor:pointer;align-items:center;font:inherit;color:inherit}
.hit:last-child{border-bottom:0}
.hit:hover{background:var(--inset)}
.thumb{width:42px;height:42px;border-radius:8px;object-fit:cover;background:var(--inset);border:1px solid var(--line)}
.thumb-ph{display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:14px;color:var(--muted)}
.c-name{display:flex;flex-direction:column;min-width:0}
.c-name b{font-weight:500;font-size:14.5px;overflow-wrap:anywhere}
.c-name span{font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.03em}
.c-num{font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--ink-2);min-width:0;overflow-wrap:anywhere}
.c-last{display:flex;flex-direction:column;min-width:0}
.c-last>span{font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.c-tags{display:flex;flex-wrap:wrap;gap:4px;min-width:0}
.c-tags .tag{font-size:11px;padding:1px 8px}
.empty{padding:34px 16px;text-align:center;color:var(--muted);font-size:13px}

/* 個案頁：頂端返回列 */
.casebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.casebar .cname{font-family:var(--serif);font-size:17px;font-weight:700}
.casebar .ccode{font-family:var(--mono);font-size:11.5px;color:var(--accent-ink);background:var(--accent-soft);padding:2px 7px;border-radius:5px}
.casebar .nav{display:flex;gap:6px;margin-left:auto}
.casebar .nav .pos{font-family:var(--mono);font-size:11.5px;color:var(--muted);align-self:center;margin-right:4px}
#caseView{padding-block:18px 0}

/* record sheet */
.sheet{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:0;overflow:hidden}
.cell{padding:16px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0;display:flex;flex-direction:column}
.cell:nth-child(2),.cell:nth-child(4){border-right:0}
.cell:nth-child(3),.cell:nth-child(4){border-bottom:0}
.cell-h{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.cell-h h3{margin:0;font-size:12px;letter-spacing:.16em;color:var(--muted);font-weight:500}
.cell-h .hint{font-size:11px;color:var(--muted);opacity:.85}

.idcard{display:grid;grid-template-columns:104px 1fr;gap:14px}
.photobox{display:flex;flex-direction:column;gap:6px}
.photo{width:104px;aspect-ratio:3/4;max-width:100%;border-radius:8px;object-fit:cover;background:var(--inset);border:1px solid var(--line-2);display:block}
.photo-ph{display:flex;align-items:center;justify-content:center;text-align:center;font-size:11px;color:var(--muted);padding:6px}
.code{font-family:var(--mono);font-size:12.5px;color:var(--accent-ink);background:var(--accent-soft);border-radius:5px;padding:2px 6px;display:inline-block;letter-spacing:.04em}
.namerow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
/* 可直接改的欄位：平常像紀錄，滑過才露出邊框 */
.edit{border:1px solid transparent;background:transparent;border-radius:6px;padding:2px 6px}
.edit:hover{border-color:var(--line-2)}
.edit:focus{border-color:var(--accent);background:var(--card);outline:none}
.nameinp{font-family:var(--serif);font-size:22px;font-weight:700;letter-spacing:.02em;width:min(100%,9em);margin-left:-6px}
.codeinp{font-family:var(--mono);font-size:12.5px;color:var(--accent-ink);background:var(--accent-soft);width:16ch;letter-spacing:.04em}
.codeinp:hover,.codeinp:focus{background:var(--accent-soft)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;align-items:center;font-size:13px}
.facts>label{color:var(--muted);font-size:12px;white-space:nowrap}
.facts .factinp{width:100%;min-width:0;font-size:13px}
.facts .factinp.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.facts .ro{color:var(--ink-2);font-family:var(--mono);font-variant-numeric:tabular-nums;padding-left:7px}
.cellfoot{margin-top:auto;padding-top:12px;display:flex}
.reasons{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.tag{font-size:11.5px;border:1px solid var(--line-2);border-radius:999px;padding:2px 9px;color:var(--ink-2)}
.tag-r{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft)}
.reasons{align-items:center}
.rlabel{font-size:11px;letter-spacing:.1em;color:var(--muted);flex-basis:100%;margin-bottom:-2px}
.chip-sm{padding:3px 9px;font-size:12px}
.reasoninp{margin-top:8px;font-size:12.5px;padding:6px 9px;background:var(--inset)}
.reasoninp:focus{background:var(--card)}
.since{font-family:var(--mono)}
.since.warn{color:var(--accent-ink)}
.since.cold{color:var(--danger)}

/* duplicate warning */
.dup{border-radius:8px;padding:11px 12px;display:grid;gap:8px;font-size:12.5px;border:1px solid var(--line-2);background:var(--inset)}
.dup.strong{border-color:var(--danger);background:color-mix(in srgb,var(--danger) 9%,transparent)}
.dup.soft{border-color:var(--accent);background:var(--accent-wash)}
.dup b{font-size:13px}
.dup.strong b{color:var(--danger)}
.dup.soft b{color:var(--accent-ink)}
.dup ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.dup li{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 9px}
.dup .who{font-weight:500}
.dup .why{font-family:var(--mono);font-size:11px;color:var(--muted)}

/* visits */
.visits{overflow-x:auto}
table.v{width:100%;border-collapse:collapse;font-size:13px;min-width:330px}
table.v th{font-size:11px;letter-spacing:.1em;color:var(--muted);font-weight:500;text-align:left;padding:0 6px 7px;border-bottom:1px solid var(--line)}
table.v th.c,table.v td.c{text-align:center;width:52px}
table.v td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
table.v tr:last-child td{border-bottom:0}
table.v tr.sel td{background:var(--accent-wash)}
table.v tbody tr{cursor:pointer}
table.v tbody tr:hover td{background:var(--inset)}
table.v tr.sel:hover td{background:var(--accent-wash)}
.vdate{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.vseq{font-family:var(--mono);font-size:11px;color:var(--muted);margin-right:7px}
.tick{appearance:none;width:17px;height:17px;border:1.5px solid var(--line-2);border-radius:4px;cursor:pointer;display:inline-grid;place-content:center;vertical-align:middle}
.tick::after{content:"";width:9px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translateY(-1px);opacity:0}
.tick:checked::after{opacity:1}
.tick.i:checked{background:var(--teal);border-color:var(--teal)}
.tick.f:checked{background:var(--blue);border-color:var(--blue)}
.tick.c:checked{background:var(--plum);border-color:var(--plum)}
:root[data-theme="dark"] .tick::after,:root:not([data-theme="light"]) .tick::after{border-color:#14131F}
.notedot{width:6px;height:6px;border-radius:50%;background:var(--accent);display:inline-block}
.addvisit{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}

/* writing areas */
.ta{width:100%;flex:1 1 auto;background:var(--inset);border:1px solid var(--line);border-radius:8px;padding:11px 12px;resize:vertical;line-height:1.75;min-height:150px}
.ta:focus{border-color:var(--accent);background:var(--card)}
.ta.lined{background-image:repeating-linear-gradient(var(--inset) 0 26px,var(--line) 26px 27px);background-attachment:local;line-height:27px;padding-top:12px}
.ta.lined:focus{background-image:repeating-linear-gradient(var(--card) 0 26px,var(--line) 26px 27px)}
.savestate{font-size:11px;color:var(--muted);font-family:var(--mono);margin-left:auto}
.noteline{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.noteline .inp{flex:1 1 120px}
.noteline .inp.fee{flex:0 0 118px}
.selvisit{font-family:var(--mono);font-size:12px;color:var(--accent-ink);background:var(--accent-soft);padding:2px 8px;border-radius:5px}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(18,16,28,.55);backdrop-filter:blur(3px);z-index:80;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 30px 70px -20px rgba(0,0,0,.5);width:min(520px,100%);max-height:90vh;overflow:auto}
.modal-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.modal-h h3{margin:0;font-family:var(--serif);font-size:16px}
.modal-b{padding:16px;display:grid;gap:12px}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#camStage{background:#0E0D16;border-radius:10px;aspect-ratio:3/4;max-width:100%;width:100%;overflow:hidden;display:flex;align-items:center;justify-content:center;position:relative}
#camStage video,#camStage img{width:100%;height:100%;object-fit:cover;display:block}
.camnote{font-size:12.5px;color:var(--muted);text-align:center;padding:18px}
.camnote b{color:var(--ink-2);display:block;margin-bottom:6px;font-size:13px}
.filelabel{display:inline-block;border:1px solid var(--line-2);border-radius:var(--r);padding:9px 14px;cursor:pointer;background:var(--card)}
.filelabel:hover{border-color:var(--accent)}
.filelabel input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

.demobar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted);padding-block:10px 0}
.demobar .dot{width:5px;height:5px;border-radius:50%;background:var(--accent)}
.foot{color:var(--muted);font-size:12px;padding-block:22px 0;border-top:1px solid var(--line);margin-top:22px;display:grid;gap:4px}

@media (max-width:860px){
  .cols{display:none}
  .hit{grid-template-columns:42px 1fr;gap:4px 12px;padding:11px 14px}
  .hit>:not(.thumb){grid-column:2}
  .hit>.thumb{grid-row:1/span 4}
  .c-tags{margin-top:2px}
  .sheet{grid-template-columns:1fr}
  .cell{border-right:0}
  .cell:nth-child(3){border-bottom:1px solid var(--line)}
}
@media (max-width:620px){
  .searchbar{grid-template-columns:1fr 1fr}
  .searchbar .field:nth-child(3){grid-column:1/-1}
  .searchbar>.btn{grid-column:1/-1}
  .grid2{grid-template-columns:1fr}
  .idcard{grid-template-columns:88px 1fr}
  .photo{width:88px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="top">
  <div class="top-in">
    <div class="brandline">
      <span class="brand">希望之光<span class="lamp">・</span>個案檢索</span>
      <span class="sub">HOPE LIGHT　腦意識紀錄</span>
      <span class="spacer"></span>
      <span class="mode" id="mode">示範資料</span>
    </div>
    <div id="homeControls">
    <div class="searchbar">
      <div class="field"><label for="qName">姓　名</label><input class="inp" id="qName" placeholder="輸入部分姓名即可" autocomplete="off"></div>
      <div class="field"><label for="qPhone">電　話</label><input class="inp" id="qPhone" placeholder="0912 或末三碼" inputmode="numeric" autocomplete="off"></div>
      <div class="field"><label for="qBirth">生　日</label><input class="inp" id="qBirth" placeholder="1985 / 0312 / 85-03" autocomplete="off"></div>
      <button class="btn" id="btnClear" type="button">清除</button>
    </div>
    <div class="advtoggle">
      <button class="btn btn-ghost btn-sm" id="btnAdv" type="button" aria-expanded="false">＋ 進階搜尋</button>
      <button class="btn btn-ghost btn-sm" id="btnNew" type="button">＋ 新增客戶</button>
      <span class="savestate" id="saveState"></span>
    </div>
    <div class="adv" id="advPanel" hidden></div>
    </div>
    <div class="casebar" id="caseBar" hidden></div>

  clients: JSON.parse(JSON.stringify(SEED)),
  selectedId: "c1",
  selectedVisit: {},
  q: {name:"", phone:"", birthday:""},
  adv: {from:"", to:"", reasons:[], types:[], stale:0},

};
var db = null;

/* ---------- utils ---------- */
function el(id){return document.getElementById(id);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function digits(s){return String(s||"").replace(/\D/g,"");}
function lastVisitDate(c){var d="";(c.visits||[]).forEach(function(v){if(v.date>d)d=v.date;});return d;}
function age(b){if(!b)return"";var t=new Date(),d=new Date(b);if(isNaN(d))return"";var a=t.getFullYear()-d.getFullYear();var m=t.getMonth()-d.getMonth();if(m<0||(m===0&&t.getDate()<d.getDate()))a--;return a>=0&&a<130?a:"";}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function uid(p){return p+Math.random().toString(36).slice(2,9);}
function mmdd(d){ return String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function bdayKey(c){ return (c.birthday||"").slice(5); }
/* 客戶編號：139-00001 起跳，取現有最大號 +1 */
function nextCode(){
  var max=0;
  state.clients.forEach(function(c){
    var m=/^139-(\d+)$/.exec(c.code||"");
    if(m){ var n=parseInt(m[1],10); if(n>max)max=n; }
  });
  return "139-"+String(max+1).padStart(5,"0");
}
function monthsSince(dateStr){
  if(!dateStr)return Infinity;
  var d=new Date(dateStr); if(isNaN(d))return Infinity;
  var n=new Date();
  var m=(n.getFullYear()-d.getFullYear())*12+(n.getMonth()-d.getMonth());
  if(n.getDate()<d.getDate())m--;
  return m<0?0:m;
}
function sinceLabel(dateStr){
  if(!dateStr)return "尚未來訪";
  var m=monthsSince(dateStr);
  if(m===Infinity)return "尚未來訪";
  if(m<1)return "本月來過";
  if(m<12)return m+" 個月沒來";
  var y=Math.floor(m/12), r=m%12;
  return y+" 年"+(r?r+" 個月":"")+"沒來";
}
function sinceClass(dateStr){
  var m=monthsSince(dateStr);
  return m>=6?"since cold":m>=3?"since warn":"since";
}
function isEditing(){var a=document.activeElement;return !!a&&(a.tagName==="TEXTAREA"||(a.tagName==="INPUT"&&a.closest("#sheet")));}
function currentClient(){for(var i=0;i<state.clients.length;i++){if(state.clients[i].id===state.selectedId)return state.clients[i];}return null;}

/* ---------- persistence ---------- */
var queue = Promise.resolve();
var saveTimer = null;
function flag(msg){var s=el("saveState");if(!s)return;s.textContent=msg;if(msg){clearTimeout(saveTimer);saveTimer=setTimeout(function(){s.textContent="";},1800);}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(state.clients));}catch(e){}}
function loadLocal(){try{var raw=localStorage.getItem(LS);if(!raw)return null;var v=JSON.parse(raw);return Array.isArray(v)&&v.length?v:null;}catch(e){return null;}}
function persist(client){
  saveLocal();
  flag("已儲存");
  if(!db||!client)return;
  var body=JSON.parse(JSON.stringify(client));
  body.updatedAt=new Date().toISOString();
  queue=queue.then(function(){return db.doc("clients/"+client.id).set(body);}).catch(function(err){
    if(err&&err.code==="invalid_argument"){state.live=false;renderMode();flag("此帳號無法寫入，僅存於本機");}
    else{flag("雲端同步稍後重試");}
  });
}
function removeClient(id){
  saveLocal();
  if(!db)return;
  queue=queue.then(function(){return db.doc("clients/"+id).delete();}).catch(function(){});
}

/* ---------- search ---------- */
function matches(c){
  var q=state.q,a=state.adv;
  if(q.name && c.name.indexOf(q.name.trim())<0) return false;
  if(q.phone){ if(digits(c.phone).indexOf(digits(q.phone))<0) return false; }
  if(q.birthday){
    var d=digits(q.birthday);
    if(d){ if(digits(c.birthday).indexOf(d)<0) return false; }
    else if(c.birthday.indexOf(q.birthday.trim())<0) return false;
  }
  if(a.reasons.length){
    var hit=false;
    for(var i=0;i<a.reasons.length;i++){ if((c.reasons||[]).indexOf(a.reasons[i])>=0){hit=true;break;} }
    if(!hit) return false;
  }
  if(a.stale && monthsSince(lastVisitDate(c)) < a.stale) return false;
  if(a.from||a.to||a.types.length){
    var ok=false;
    (c.visits||[]).forEach(function(v){
      if(a.from && v.date < a.from) return;
      if(a.to && v.date > a.to) return;
      if(a.types.length){
        var t=false;
        a.types.forEach(function(k){ if(v[k]) t=true; });
        if(!t) return;
      }
      ok=true;
    });
    if(!ok) return false;
  }
  return true;
}
function results(){
  return state.clients.filter(matches).sort(function(x,y){
    var a=lastVisitDate(x),b=lastVisitDate(y);
    return a<b?1:a>b?-1:0;
  });
}
function activeFilterCount(){
  var a=state.adv,n=0;
  if(a.from||a.to)n++;
  if(a.stale)n++;
  n+=a.reasons.length+a.types.length;
  return n;
}

/* ---------- render: results ---------- */
function renderResults(){
  var list=results();

function go(view,id){
  var target = (view==="case"&&id) ? "#/case/"+id : "#/";
  if(location.hash===target){ applyRoute(); return; }
  try{ location.hash=target; }
  catch(e){ state.view=view; if(id)state.selectedId=id; renderAll(); }
}
function applyRoute(){
  var h=(location.hash||"").replace(/^#\/?/,"");
  if(h.indexOf("case/")===0){
    var id=h.slice(5);
    var found=null;
    state.clients.forEach(function(c){ if(c.id===id)found=c; });
    if(found){ state.selectedId=id; state.view="case"; }
    else state.view="home";
  } else state.view="home";
  renderAll();
  window.scrollTo(0,0);
}

function renderBirthdays(){
  var box=el("bday"); if(!box)return;

  var hoy=[], soon=[];
  state.clients.forEach(function(c){
    var k=bdayKey(c); if(!k)return;
    if(k===today)hoy.push(c);
    else if(k.slice(0,2)===mon)soon.push(c);
  });
  soon.sort(function(a,b){ return bdayKey(a)<bdayKey(b)?-1:1; });
  if(hoy.length){
    box.className="bdaybox on";
    box.innerHTML='<div class="bdayhead"><h2>今 日 壽 星</h2><span class="count">'+hoy.length+'</span>'+

      '<ul class="bdaylist">'+hoy.map(function(c){
        return '<li><button class="bdayname" type="button" data-open="'+c.id+'">'+esc(c.name)+'</button>'+
          '<span class="bdayage">'+(age(c.birthday)!==""?age(c.birthday)+" 歲":"")+'</span>'+
          '<span class="bdayvia">'+(c.lineId?'LINE '+esc(c.lineId):'')+(c.lineId&&c.phone?'　·　':'')+esc(c.phone||"")+'</span></li>';
      }).join("")+'</ul>';

/* ---------- camera ---------- */
var stream=null, shot="";
function stopStream(){ if(stream){ stream.getTracks().forEach(function(t){t.stop();}); stream=null; } }
function camFallback(msg){

  s.innerHTML='<div class="camnote"><b>這個環境無法開啟相機</b>'+esc(msg)+'<br>可以改用下方「從檔案選擇」，直接放入已拍好的照片。</div>';

function openCamera(){

    '<div class="modal-h"><h3>拍攝個案照片</h3><span class="spacer" style="flex:1"></span><button class="btn btn-ghost btn-sm" type="button" id="btnCamClose">關閉</button></div>'+
    '<div class="modal-b">'+
      '<div id="camStage"><div class="camnote">正在開啟攝影機…</div></div>'+
      '<p style="margin:0;font-size:12px;color:var(--muted)">照片會裁成 3:4 直式，縮到適合存檔的尺寸後存進這位個案的欄位。</p>'+
    '</div>'+
    '<div class="modal-f">'+
      '<label class="filelabel">從檔案選擇<input type="file" accept="image/*" id="camFile"></label>'+
      '<span style="flex:1"></span>'+
      '<button class="btn" type="button" id="btnRetake" hidden>重拍</button>'+
      '<button class="btn btn-primary" type="button" id="btnCapture">拍照</button>'+
      '<button class="btn btn-primary" type="button" id="btnUse" hidden>使用這張</button>'+
    '</div>'
  );
  el("btnCamClose").addEventListener("click",function(){ stopStream(); closeModal(); });
  el("camFile").addEventListener("change",function(e){
    var f=e.target.files&&e.target.files[0]; if(!f)return;
    var img=new Image();
    img.onload=function(){ shot=crop(img); showShot(); URL.revokeObjectURL(img.src); };
    img.onerror=function(){ alert("這個檔案讀不出來，換一張試試。"); };
    img.src=URL.createObjectURL(f);
  });
  el("btnCapture").addEventListener("click",function(){
    var v=el("camVideo"); if(!v)return;
    shot=crop(v,v.videoWidth,v.videoHeight); showShot();
  });
  el("btnRetake").addEventListener("click",function(){ shot=""; startStream(); });
  el("btnUse").addEventListener("click",function(){
    var c=currentClient();
    if(c&&shot){ c.photo=shot; persist(c); }
    stopStream(); closeModal(); renderResults(); renderSheet();
  });
  startStream();
}
function startStream(){
  var stage=el("camStage"); if(!stage)return;
  el("btnUse").hidden=true; el("btnRetake").hidden=true; el("btnCapture").hidden=false; el("btnCapture").disabled=false;
  stage.innerHTML='<div class="camnote">正在開啟攝影機…</div>';
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    camFallback("這個瀏覽器或內嵌視窗沒有提供攝影機介面。"); return;
  }
  navigator.mediaDevices.getUserMedia({video:{width:{ideal:1280},height:{ideal:960},facingMode:"user"},audio:false})
   .then(function(s){
      stream=s;
      stage.innerHTML='<video id="camVideo" playsinline autoplay muted></video>';
      var v=el("camVideo"); v.srcObject=s; v.play().catch(function(){});
   })
   .catch(function(err){
      var n=err&&err.name;
      camFallback(n==="NotAllowedError"?"瀏覽器拒絕了攝影機權限。":n==="NotFoundError"?"找不到可用的攝影機。":"原因："+esc(n||"未知"));
   });
}
function showShot(){
  stopStream();
  var stage=el("camStage"); if(!stage)return;
  stage.innerHTML='<img src="'+shot+'" alt="拍攝預覽">';
  el("btnCapture").hidden=true; el("btnRetake").hidden=false; el("btnUse").hidden=false;
}
function crop(src,w,h){
  w=w||src.naturalWidth||src.width; h=h||src.naturalHeight||src.height;
  var TW=360, TH=480, ratio=TW/TH;
  var sw=w, sh=Math.round(w/ratio);
  if(sh>h){ sh=h; sw=Math.round(h*ratio); }
  var sx=Math.round((w-sw)/2), sy=Math.round((h-sh)/2);
  var cv=document.createElement("canvas"); cv.width=TW; cv.height=TH;
  cv.getContext("2d").drawImage(src,sx,sy,sw,sh,0,0,TW,TH);
  return cv.toDataURL("image/jpeg",0.72);
}

/* ---------- duplicate detection ---------- */
function findDupes(name,phone,birthday,lineId,excludeId){
  var out=[], nm=(name||"").trim(), ph=digits(phone), bd=(birthday||"").trim(),
      li=(lineId||"").trim().toLowerCase();
  state.clients.forEach(function(c){
    if(c.id===excludeId)return;
    var why=[];
    if(nm&&c.name===nm)why.push("同姓名");
    if(ph&&digits(c.phone)===ph)why.push("同電話");
    if(li&&(c.lineId||"").toLowerCase()===li)why.push("同 LINE ID");
    if(bd&&c.birthday===bd)why.push("同生日");
    if(!why.length)return;
    out.push({c:c,why:why,strong:why.indexOf("同電話")>=0||why.indexOf("同生日")>=0||why.indexOf("同 LINE ID")>=0});
  });
  return out;
}

    var d=findDupes(el("nName").value,el("nPhone").value,el("nBirth").value,el("nLine").value);
    if(!d.length){ box.innerHTML=""; save.textContent="建立並開啟"; return d; }
    var strong=false; d.forEach(function(x){ if(x.strong)strong=true; });
    box.innerHTML='<div class="dup '+(strong?"strong":"soft")+'">'+
      '<b>'+(strong?"這一位可能已經建過檔了":"有同名的個案，先確認一下")+'</b>'+
      '<span>'+(strong?"電話、LINE ID 或生日和既有個案一樣，通常就是同一個人。建議直接開啟舊檔接著寫，不要另開一筆。"
                      :"姓名一樣，但電話與生日不同，很可能是不同人。確認後再建立。")+'</span>'+
      '<ul>'+d.map(function(x){
        return '<li><span class="who">'+esc(x.c.name)+'</span>'+
          '<span class="why">'+esc(x.why.join("・"))+'　'+esc(x.c.code)+'　'+esc(x.c.phone||"無電話")+'　'+esc(x.c.birthday||"無生日")+'</span>'+
          '<span style="flex:1"></span><button class="btn btn-sm" type="button" data-open="'+x.c.id+'">開啟這一位</button></li>';
      }).join("")+'</ul></div>';
    save.textContent=strong?"確認是不同人，仍要建立":"確認過了，建立";
    return d;
  }
  ["nName","nPhone","nBirth","nLine"].forEach(function(id){
    el(id).addEventListener("input",function(){ dupAck=false; renderDup(); });
  });
  el("dupWarn").addEventListener("click",function(e){
    var b=e.target.closest("button[data-open]"); if(!b)return;
    closeModal(); go("case",b.dataset.open);
  });
  el("nReasons").addEventListener("click",function(e){
    var b=e.target.closest("button[data-r]"); if(!b)return;
    var i=picked.indexOf(b.dataset.r);
    if(i>=0){picked.splice(i,1);b.setAttribute("aria-pressed","false");}
    else{picked.push(b.dataset.r);b.setAttribute("aria-pressed","true");}
  });
  el("nCancel").addEventListener("click",closeModal);
  el("nSave").addEventListener("click",function(){
    var name=el("nName").value.trim();
    if(!name){ el("nName").focus(); flag("請先填姓名"); return; }
    var d=renderDup();
    if(d.length && !dupAck){
      dupAck=true;
      el("dupWarn").scrollIntoView({block:"nearest"});
      flag("請先看上方的重複提醒");
      return;
    }
    var c={id:uid("c"),code:nextCode(),name:name,
      phone:el("nPhone").value.trim(),lineId:el("nLine").value.trim(),birthday:el("nBirth").value,gender:el("nGender").value.trim(),
      occupation:el("nOcc").value.trim(),religion:el("nRel").value.trim(),
      reasons:picked.slice(),reasonNote:el("nNote").value.trim(),
      firstVisit:el("nFirst").value||today(),photo:"",direction:"",
      visits:[{id:uid("v"),date:el("nFirst").value||today(),initial:true,follow:false,course:false,item:"腦意識評量",fee:"2980",note:""}]};
    state.clients.push(c);
    persist(c); closeModal(); go("case",c.id);
  });
  el("nName").focus();
});

/* ---------- boot ---------- */
migrate(state.clients);
var local=loadLocal();
if(local)state.clients=migrate(local);
if(!currentClient()&&state.clients.length)state.selectedId=state.clients[0].id;
applyRoute();

(function connect(){
  if(!window.claude||typeof window.claude.use!=="function")return;
  window.claude.use("db").then(function(d){
    if(!d)return;
    db=d;
    db.collection("clients").onSnapshot(function(snap){
      if(snap.empty){
        state.live=true; renderMode();
        // first run on this artifact: push the demo set up so every viewer sees the same thing
        state.clients.forEach(function(c){ persist(c); });
        return;
      }
      var list=snap.docs.map(function(d2){ var o=d2.data()||{}; o.id=d2.id; return o; });
      state.clients=migrate(list);
      state.live=true;
      if(!currentClient()&&state.clients.length)state.selectedId=state.clients[0].id;
      saveLocal();
      if(isEditing()){ renderMode(); renderResults(); }
      else renderAll();
    },function(){ state.live=false; renderMode(); });
  }).catch(function(){});
})();
</script>
